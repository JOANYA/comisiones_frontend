<!-- =====================================================================
     LAYOUT: sidebar fijo a la izquierda + area de contenido.
     Bajo 1024px el sidebar pasa a ser un cajon y aparece una barra
     superior con el boton de menu.
     ===================================================================== -->

<!-- Pantallas sin sesion: solo el contenido centrado -->
<main *ngIf="sinChrome()" class="min-h-screen flex items-center justify-center p-4">
  <router-outlet></router-outlet>
</main>

<div *ngIf="!sinChrome()" class="min-h-screen lg:flex">

  <!-- Barra superior, solo movil -->
  <header class="lg:hidden sticky top-0 z-30 flex items-center gap-3 px-4 py-3 dn-glass rounded-none border-x-0 border-t-0">
    <button class="dn-btn dn-btn-ghost !p-2" (click)="abiertoMovil.set(!abiertoMovil())" aria-label="Abrir menú">
      <dn-icon name="menu" [size]="20"></dn-icon>
    </button>
    <span class="font-extrabold tracking-tight">DraNotes</span>
    <a routerLink="/comisiones/nueva" class="dn-btn dn-btn-primary !py-1.5 !px-3 ml-auto text-sm">
      <dn-icon name="mas" [size]="16"></dn-icon> Nueva
    </a>
  </header>

  <!-- Fondo del cajon en movil -->
  <div *ngIf="abiertoMovil()" class="lg:hidden fixed inset-0 z-40 bg-black/70 backdrop-blur-sm"
       (click)="abiertoMovil.set(false)"></div>

  <!-- ================= SIDEBAR ======================================== -->
  <aside class="fixed lg:sticky top-0 z-50 h-screen shrink-0 flex flex-col transition-all duration-300 lg:translate-x-0"
         [style.width]="colapsado() ? '76px' : '292px'"
         [class.-translate-x-full]="!abiertoMovil()"
         [class.translate-x-0]="abiertoMovil()"
         style="background:linear-gradient(180deg,#120E1F,#0A0812);border-right:1px solid var(--dn-line)">

    <!-- Header: logotipo + version -->
    <div class="p-4 border-b" style="border-color:var(--dn-line)">
      <div class="flex items-center gap-2.5">
        <span class="dn-shimmer-hover shrink-0 grid place-items-center rounded-2xl"
              style="width:40px;height:40px;background:linear-gradient(135deg,#A855F7,#F43F5E);color:#fff">
          <dn-icon name="calavera-mono" [size]="22" [grosor]="1.6"></dn-icon>
        </span>

        <div *ngIf="!colapsado()" class="min-w-0">
          <div class="flex items-center gap-1.5">
            <h1 class="text-[1.05rem] leading-none font-extrabold">DraNotes</h1>
            <span style="color:#FFB7C5"><dn-icon name="destello" [size]="13"></dn-icon></span>
          </div>
          <span class="dn-pixel" style="color:#6E5C8E">v2.0 · kuromi build</span>
        </div>

        <button class="ml-auto hidden lg:grid place-items-center rounded-lg p-1.5" style="color:#A594C4"
                (click)="alternarColapso()"
                [attr.aria-label]="colapsado() ? 'Expandir menú' : 'Colapsar menú'">
          <dn-icon name="chevron" [size]="18"
                   [ngStyle]="{transform: colapsado() ? 'rotate(-90deg)' : 'rotate(90deg)'}"></dn-icon>
        </button>
      </div>

      <!-- Ficha de la artista, tomada de la sesion -->
      <div *ngIf="!colapsado()" class="mt-3 flex items-center gap-2.5 rounded-xl px-2.5 py-2"
           style="background:rgba(168,85,247,.10);border:1px solid var(--dn-line)">
        <span class="grid place-items-center rounded-full shrink-0"
              style="width:34px;height:34px;background:#0A0812;border:1px solid #F43F5E;color:#FFB7C5">
          <dn-icon name="mono" [size]="18"></dn-icon>
        </span>
        <div class="min-w-0">
          <p class="text-sm font-semibold truncate">{{ nombreArtista }}</p>
          <p class="text-xs truncate" style="color:#A594C4">{{ handleArtista }}</p>
        </div>
      </div>
    </div>

    <!-- Buscador en tiempo real -->
    <div class="px-4 pt-4" *ngIf="!colapsado()">
      <label class="dn-label" for="buscador">Buscar</label>
      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2" style="color:#6E5C8E">
          <dn-icon name="lupa" [size]="16"></dn-icon>
        </span>
        <input id="buscador" type="search" class="dn-input !pl-9" placeholder="cliente, @cuenta o título"
               [ngModel]="store.busqueda()" (ngModelChange)="store.busqueda.set($event)">
      </div>
    </div>

    <!-- Chips de estado, multiseleccion -->
    <div class="px-4 pt-4" *ngIf="!colapsado()">
      <div class="flex items-baseline justify-between mb-2">
        <span class="dn-label !mb-0">Filtrar por estado</span>
        <button *ngIf="store.estadosActivos().size || store.busqueda()" class="text-xs underline"
                style="color:#C084FC" (click)="store.limpiarFiltros()">limpiar</button>
      </div>

      <div class="flex flex-wrap gap-1.5">
        <button *ngFor="let e of estadosArte" class="dn-chip" [ngClass]="estiloEstado(e).clase"
                [attr.aria-pressed]="store.estadoActivo(e)" (click)="store.alternarEstado(e)">
          <dn-icon [name]="estiloEstado(e).icono" [size]="13" [grosor]="2"></dn-icon>
          {{ e }}
          <span class="dn-pixel opacity-70">{{ conteo(e) }}</span>
        </button>

        <!-- Derivado de vw_saldo_comisiones: saldo_pendiente > 0 -->
        <button class="dn-chip dn-pago-cero" [attr.aria-pressed]="store.estadoActivo(filtroDeuda)"
                (click)="store.alternarEstado(filtroDeuda)">
          <dn-icon name="billetera" [size]="13" [grosor]="2"></dn-icon>
          {{ filtroDeuda }}
          <span class="dn-pixel opacity-70">{{ conteo(filtroDeuda) }}</span>
        </button>
      </div>
    </div>

    <!-- Acordeon con la lista filtrada -->
    <nav class="px-4 pt-5 pb-4 flex-1 min-h-0 flex flex-col">
      <a routerLink="/dashboard"
         class="flex items-center gap-2.5 rounded-xl px-2.5 py-2 mb-1 text-sm font-semibold"
         style="color:#A594C4" [class.justify-center]="colapsado()"
         [ngStyle]="{background: rutaActual().includes('dashboard') ? 'rgba(168,85,247,.16)' : 'transparent'}">
        <dn-icon name="disco" [size]="18"></dn-icon>
        <span *ngIf="!colapsado()">Panel general</span>
      </a>

      <button class="w-full flex items-center gap-2.5 rounded-xl px-2.5 py-2 text-sm font-semibold"
              style="color:#A594C4" [class.justify-center]="colapsado()"
              (click)="listaAbierta.set(!listaAbierta())" [attr.aria-expanded]="listaAbierta()">
        <dn-icon name="estrella-fugaz" [size]="18"></dn-icon>
        <span *ngIf="!colapsado()">Mis comisiones</span>
        <span *ngIf="!colapsado()" class="dn-pixel ml-auto" style="color:#6E5C8E">{{ store.filtradas().length }}</span>
        <dn-icon *ngIf="!colapsado()" name="chevron" [size]="15"
                 [ngStyle]="{transform: listaAbierta() ? 'rotate(180deg)' : 'none', transition:'transform .2s'}"></dn-icon>
      </button>

      <div *ngIf="listaAbierta() && !colapsado()" class="mt-1 flex-1 min-h-0 overflow-y-auto pr-1">
        <a *ngFor="let c of store.filtradas(); trackBy: trackId" [routerLink]="['/comisiones', c.id_comision]"
           class="block rounded-lg px-2.5 py-2 mb-1 border border-transparent hover:border-[#342A4A]"
           [ngStyle]="{background: rutaActual().endsWith('/' + c.id_comision) ? 'rgba(244,63,94,.12)' : 'transparent'}">
          <div class="flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:currentColor"
                  [ngClass]="estiloEstado(store.nombreEstado(c)).clase"></span>
            <span class="text-[.82rem] font-medium truncate">{{ c.titulo }}</span>
            <span *ngIf="estadoPago(c.saldo) !== 'full'" class="ml-auto dn-pixel" style="color:#F43F5E">deuda</span>
          </div>
          <span class="text-[.72rem] pl-3.5 block truncate" style="color:#6E5C8E">{{ c.cuenta_ig }}</span>
        </a>

        <p *ngIf="!store.filtradas().length && !store.cargando()" class="text-xs px-2.5 py-3" style="color:#6E5C8E">
          Nada coincide con esa búsqueda. Prueba con el &#64; del cliente.
        </p>
      </div>
    </nav>

    <!-- Pie -->
    <div class="p-4 border-t" style="border-color:var(--dn-line)">
      <a routerLink="/comisiones/nueva" class="dn-btn dn-btn-primary w-full mb-2" [class.!px-0]="colapsado()">
        <dn-icon name="mas" [size]="17"></dn-icon>
        <span *ngIf="!colapsado()">Nueva comisión</span>
      </a>
      <button class="dn-btn dn-btn-ghost w-full" (click)="cerrarSesion()" [class.!px-0]="colapsado()">
        <dn-icon name="salir" [size]="17"></dn-icon>
        <span *ngIf="!colapsado()">Cerrar sesión</span>
      </button>
    </div>
  </aside>

  <!-- ================= CONTENIDO ====================================== -->
  <main class="flex-1 min-w-0 px-4 py-6 lg:px-8 lg:py-8">
    <router-outlet></router-outlet>
  </main>
</div>
