<div class="w-full max-w-md mx-auto px-2 sm:px-0">
  <div class="flex items-center gap-3 mb-5">
    <span class="grid place-items-center rounded-2xl shrink-0"
          style="width:52px;height:52px;background:#fff;border:1px solid var(--kk-pink);color:var(--kk-purple)">
      <dn-icon name="mono" [size]="26"></dn-icon>
    </span>
    <div class="min-w-0">
      <h1 class="text-xl sm:text-2xl leading-none font-bold">Crear cuenta</h1>
      <p class="text-xs mt-1" style="color:var(--kk-text-muted)">para artistas que ya perdieron la cuenta de sus pedidos</p>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="enviar()" class="kk-card overflow-hidden w-full">
    <div class="kk-card-header">
      <dn-icon name="estrella-fugaz" [size]="14"></dn-icon>
      <span class="kk-eyebrow" style="color:var(--kk-purple)">Registro de artista</span>
    </div>

    <div class="p-4 sm:p-6 flex flex-col gap-3.5">
      <div>
        <label class="kk-label" for="nombre">Nombre</label>
        <input id="nombre" type="text" class="kk-input w-full" formControlName="nombre">
      </div>

      <div>
        <label class="kk-label" for="correo">Correo</label>
        <input id="correo" type="email" class="kk-input w-full" formControlName="correo" autocomplete="email">
      </div>

      <div>
        <label class="kk-label" for="telefono">Teléfono</label>
        <input id="telefono" type="text" class="kk-input w-full" formControlName="telefono" placeholder="opcional">
      </div>

      <div>
        <label class="kk-label" for="password">Contraseña</label>
        <input id="password" type="password" class="kk-input w-full" formControlName="password" autocomplete="new-password">
        <p class="text-xs mt-1" style="color:var(--kk-text-muted)">Mínimo 6 caracteres. Se guarda con bcrypt, nunca en texto plano.</p>
      </div>

      <div *ngIf="error" class="rounded-xl p-3" style="border:1px solid var(--kk-red-tx);background:var(--kk-red-bg)">
        <p class="text-sm break-words" style="color:var(--kk-red-tx)">{{ error }}</p>
      </div>

      <div *ngIf="exito" class="rounded-xl p-3" style="border:1px solid var(--kk-ok-tx);background:var(--kk-ok-bg)">
        <p class="text-sm flex items-center gap-2" style="color:var(--kk-ok-tx)">
          <dn-icon name="check" [size]="15"></dn-icon> Cuenta creada. Te llevamos al login…
        </p>
      </div>

      <button class="kk-btn kk-btn-primary w-full mt-1 justify-center" type="submit" [disabled]="cargando">
        <dn-icon name="estrella-fugaz" [size]="16"></dn-icon>
        {{ cargando ? 'Creando…' : 'Crear cuenta' }}
      </button>

      <p class="text-sm text-center mt-1" style="color:var(--kk-text-muted)">
        ¿Ya tienes una? <a routerLink="/login" class="underline font-semibold" style="color:var(--kk-purple)">Inicia sesión</a>
      </p>
    </div>
  </form>
</div>
